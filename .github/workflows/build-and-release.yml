name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: 安全回归守卫
        run: |
          set -e
          FAIL=0

          # 1. llama-server 子进程必须绑定 127.0.0.1，防止绕过 hub 鉴权（上游合并曾两次覆盖回 0.0.0.0）
          if grep -q '" --host 0.0.0.0"' src/main/java/org/mark/llamacpp/server/LlamaServerManager.java; then
            echo "::error::安全回归：llama-server 子进程被改为监听 0.0.0.0（LlamaServerManager），外部可直连模型端口绕过 API Key。请恢复 --host 127.0.0.1"
            FAIL=1
          fi
          HOST_COUNT=$(grep -c '" --host 127.0.0.1"' src/main/java/org/mark/llamacpp/server/LlamaServerManager.java || true)
          if [ "$HOST_COUNT" -lt 2 ]; then
            echo "::error::安全回归：应存在两处 --host 127.0.0.1（表单模式 + 命令行模式），当前只有 $HOST_COUNT 处"
            FAIL=1
          fi

          # 2. WebSocket 握手认证必须在 pipeline 中
          if ! grep -q "WebSocketAuthHandler" src/main/java/org/mark/llamacpp/server/channel/HttpHttpsUnificationHandler.java; then
            echo "::error::安全回归：WebSocketAuthHandler 不在 HTTP pipeline 中，WebSocket 握手未鉴权"
            FAIL=1
          fi

          # 3. ApiKeyValidator 必须存在且被 BasicRouterHandler 引用（全路由鉴权入口）
          if [ ! -f src/main/java/org/mark/llamacpp/server/security/ApiKeyValidator.java ]; then
            echo "::error::安全回归：ApiKeyValidator 被删除"
            FAIL=1
          fi
          if ! grep -q "ApiKeyValidator.validate" src/main/java/org/mark/llamacpp/server/channel/BasicRouterHandler.java; then
            echo "::error::安全回归：BasicRouterHandler 未调用 ApiKeyValidator.validate"
            FAIL=1
          fi

          # 4. 自动更新必须指向本 fork
          if grep -rq "IIIIIllllIIIIIlllll" src/main/java/org/mark/llamacpp/update/ src/main/resources/web/js/settings.js; then
            echo "::error::fork 回归：自动更新地址指回了上游仓库 IIIIIllllIIIIIlllll"
            FAIL=1
          fi

          # 5. 前端页面必须引入 api-auth.js（自动注入 Bearer）
          for page in index.html index-new.html chat/index.html; do
            if [ -f "src/main/resources/web/$page" ] && ! grep -q "api-auth.js" "src/main/resources/web/$page"; then
              echo "::error::fork 回归：src/main/resources/web/$page 未引入 api-auth.js"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "==============================================="
            echo "❌ 安全回归检查未通过，详见上方 error 标注"
            echo "参考 FORK.md 了解本 fork 的安全差异与守卫点"
            echo "==============================================="
            exit 1
          fi
          echo "✅ 安全回归检查通过"

      - name: 验证 Java 版本
        run: |
          echo "Java 版本:"
          java -version
          javac -version

      - name: 创建构建目录
        run: |
          mkdir -p build/classes
          mkdir -p build/lib

      - name: 复制依赖项到 build/lib
        run: |
          cp lib/*.jar build/lib/
          echo "复制依赖项:"
          ls -lh build/lib/

      - name: 构建 classpath
        run: |
          CLASSPATH=""
          for jar in lib/*.jar; do
            if [ -z "$CLASSPATH" ]; then
              CLASSPATH="$jar"
            else
              CLASSPATH="$CLASSPATH:$jar"
            fi
          done
          echo "CLASSPATH=$CLASSPATH" >> $GITHUB_ENV

      - name: 获取构建元信息
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            APP_VERSION=${TAG#v}
          else
            TAG="dev-${GITHUB_SHA::7}"
            APP_VERSION="$TAG"
          fi
          VERSION="$TAG"
          CREATED_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "created_time=$CREATED_TIME" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "CREATED_TIME=$CREATED_TIME" >> $GITHUB_ENV
          echo "构建 Tag: $TAG"
          echo "程序版本: $APP_VERSION"
          echo "构建时间: $CREATED_TIME"

      - name: 注入构建信息
        run: |
          python3 - << 'PY'
          import os
          from pathlib import Path
          path = Path("src/main/java/org/mark/llamacpp/server/BuildInfo.java")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "{tag}": os.environ["TAG"],
              "{version}": os.environ["APP_VERSION"],
              "{createdTime}": os.environ["CREATED_TIME"],
          }
          for source, target in replacements.items():
              text = text.replace(source, target)
          path.write_text(text, encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: 编译 Java 源码
        run: |
          find src/main/java -name "*.java" -print0 | xargs -0 javac \
            -source 21 \
            -target 21 \
            -encoding UTF-8 \
            -d build/classes \
            -cp "$CLASSPATH"

      - name: 复制 resources 到 classes 目录
        run: |
          if [ -d "src/main/resources" ]; then
            cp -r src/main/resources/* build/classes/
            echo "已复制 resources 到 classes 目录"
          else
            echo "resources 目录不存在，跳过复制"
          fi

      - name: 验证编译结果
        run: |
          echo "编译输出文件数:"
          find build/classes -type f | wc -l

      - name: 下载精简版 JRE (Windows)
        run: |
          mkdir -p jre-win
          curl -L -o jre-win.zip https://github.com/IIIIIllllIIIIIlllll/Mini-JRE/releases/download/v1.0.0/mini-jre-26.0.1-win-x64.zip
          unzip -qo jre-win.zip -d jre-win
          JRE_NAME=$(ls jre-win | head -1)
          mv jre-win/$JRE_NAME jre-win/jre
          rm jre-win.zip
          echo "Windows JRE 下载完成"

      - name: 安装 MinGW-w64 交叉编译工具
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: 编译启动器 (Windows)
        run: |
          cmake -S launcher -B launcher/build-win \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DAPP_VERSION="${APP_VERSION}"
          cmake --build launcher/build-win --config Release

      - name: 生成启动器配置
        run: |
          cat > launcher.conf.win << 'EOF'
          ##MAINCLASS=org.mark.llamacpp.server.LlamaServer
          -Djava.class.path=./classes;./lib/gson-2.8.9.jar;./lib/netty-all-4.1.35.Final.jar;./lib/log4j-api-2.22.1.jar;./lib/log4j-core-2.22.1.jar;./lib/log4j-slf4j2-impl-2.22.1.jar;./lib/slf4j-api-2.0.9.jar
          -Xms128m
          -Xmx128m
          -XX:MaxDirectMemorySize=128m
          EOF

      - name: 收集启动器产物
        run: |
          WIN_BIN=$(find launcher/build-win -name llama.cpp-hub.exe -type f | head -1)
          cp "$WIN_BIN" launcher/llama.cpp-hub.exe
          echo "Windows launcher: $WIN_BIN"

      - name: 创建启动脚本 (Windows, 内置 JRE)
        run: |
          cat > build/run.bat << 'EOF'
          @echo off
          cd /d "%~dp0"

          rem ============================================================
          rem JVM 内存参数说明 / JVM Memory Configuration
          rem ============================================================
          rem 本应用是轻量级 HTTP 服务器，默认分配 128MB 内存。
          rem 模型由外部 llama.cpp 进程加载，不占用此 JVM 内存。
          rem 通常不需要调整。仅在遇到 OutOfMemoryError 时才考虑增加。
          rem
          rem This is a lightweight HTTP server with 128MB default memory.
          rem Models are loaded by external llama.cpp processes, not this JVM.
          rem Normally no adjustment needed. Only increase if you encounter
          rem OutOfMemoryError (e.g. many concurrent connections or large uploads).
          rem ============================================================
          start "" jre\bin\javaw.exe -Xms128m -Xmx128m -XX:MaxDirectMemorySize=128m -classpath "./classes;./lib/*" org.mark.llamacpp.server.LlamaServer %*
          EOF

      - name: 复制文档到 build 目录
        run: |
          if [ -f README.md ]; then
            cp README.md build/
          fi

      - name: 打包 Windows 版本（无 llama.cpp）
        id: package
        run: |
          mkdir -p dist
          cp -r build build-win
          rm -rf build-win/classes/tools/easy-tools/linux 2>/dev/null || true
          cp -r jre-win/jre build-win/jre
          mkdir -p build-win/llamacpp
          cp launcher/llama.cpp-hub.exe build-win/
          cp launcher.conf.win build-win/launcher.conf
          mv build-win "llama.cpp-hub-${VERSION}-windows"
          zip -r -9 -X "dist/llama.cpp-hub-${VERSION}-windows.zip" "llama.cpp-hub-${VERSION}-windows"

      - name: 生成 Release Notes
        id: release_notes
        run: |
          LATEST_COMMIT=$(git log -1 --pretty=format:"%h - %s (%an, %ar)")
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS_SINCE_TAG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS_SINCE_TAG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi

          cat > release_notes.md << 'HEADER'
          ## 🚀 Release Notes

          > ⚠️ **安全声明**：已启用 API Key 全路由验证 + 防暴力破解 + WebSocket 鉴权。配置方式见 README。

          ### 📦 本 Release 包含

          **Windows 版本（内置 JRE，无 llama.cpp）：**
          HEADER

          echo "- \`llama.cpp-hub-${VERSION}-windows.zip\`" >> release_notes.md

          cat >> release_notes.md << 'BODY'

          > 不含 llama.cpp，适合已有 llama.cpp 或需要自行管理 llama.cpp 版本的用户。

          ### 📝 使用方法

          ```cmd
          unzip llama.cpp-hub-${VERSION}-windows.zip
          cd llama.cpp-hub-${VERSION}-windows
          run.bat
          ```

          **注意：**
          - 本版本已内置精简版 JRE，无需额外安装 Java 环境。
          - 需要自行下载 llama.cpp 并放置在 `llamacpp/` 目录下。
          - **安全警告：** 本应用为局域网工具，不具备互联网安全防护能力。请勿将服务端口直接暴露到公网。
          BODY

          sed -i "s/\${VERSION}/${VERSION}/g" release_notes.md

          echo "" >> release_notes.md
          echo "### 📋 自上次发布以来的变更" >> release_notes.md
          echo "" >> release_notes.md
          echo "$COMMITS_SINCE_TAG" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "*构建时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*" >> release_notes.md
          echo "### 📌 最新提交" >> release_notes.md
          echo "$LATEST_COMMIT" >> release_notes.md

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-hub-${{ steps.get_version.outputs.version }}
          path: |
            dist/*.zip
            release_notes.md
          retention-days: 30
